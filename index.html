<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinavi - Tamil Chatbot</title>
    <link rel="stylesheet" href="vinavi.css">
</head>
<body>
<canvas id="floatingCanvas"></canvas>
<canvas id="floating-letters"></canvas>

    <div class="chat-container">
        <button id="chatbot-toggler">💬 Open Vinavi</button>
        <div class="chatbox">
            <div class="chat-header">
                <h2>Vinavi 🤖</h2>
                <button id="close-chatbot">×</button>
            </div>
            <div class="chat-body"></div>
            <div class="chat-form">
                <input type="text" class="message-input" placeholder="Type in Tamil or Thanglish...">
                <button id="send-message">📩</button>
            </div>
        </div>
    </div>
    <script src="vinavi.js"></script>
</body>
</html>
